name: Build Photos Cleaner APK

on:
  push:
    branches: [ "test/chatgpt-write-access", "photos-cleaner-build" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-36 build-tools;36.0.0"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"
      - name: Build debug APK
        run: gradle :photoscleaner:assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: photos-cleaner-debug-apk
          path: photoscleaner/build/outputs/apk/debug/photoscleaner-debug.apk
          if-no-files-found: error
